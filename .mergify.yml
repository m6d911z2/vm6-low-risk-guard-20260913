pull_request_rules: []
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  max_parallel_checks: 1
queue_rules:
  - name: vm6-reviewbind-20260923
    queue_conditions:
      - base = vm6-reviewbind-base-20260923
    merge_conditions:
      - label = question
      - check-success = @github-actions/vm6-reviewbind-delay
    batch_size: 2
    merge_method: merge-batch
    max_checks_retries: 0
    checks_timeout: null
  - name: default
    batch_size: 1
    queue_conditions: []
    merge_conditions:
      - check-success = vm6-native-stack-failure-gate
      - check-success = vm6-native-stack-never-merge
merge_protections:
  - name: VM6 Review Requirements
    if: []
    success_conditions:
      - or:
          - "#approved-reviews-by>=2"
          - and:
              - label = low risk
              - "#approved-reviews-by>=1"
merge_protections_settings:
  reporting_method: check-runs
  post_comment: true
  auto_merge_conditions: true
