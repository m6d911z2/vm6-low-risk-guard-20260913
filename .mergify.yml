pull_request_rules: []
queue_rules:
  - name: default
    batch_size: 1
    queue_conditions: []
    merge_conditions:
      - check-success = vm6-native-stack-failure-gate
      - check-success = vm6-native-stack-never-merge
merge_protections:
  - name: VM6 Review Requirements
    if: []
    success_conditions:
      - or:
          - "#approved-reviews-by>=2"
          - and:
              - label = low risk
              - "#approved-reviews-by>=1"
merge_protections_settings:
  reporting_method: check-runs
  post_comment: true
  auto_merge_conditions: true
