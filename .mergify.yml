pull_request_rules: []
queue_rules:
  - name: default
    batch_size: 1
    queue_conditions: []
    merge_conditions:
      - check-success = vm6-native-stack-failure-gate
      - check-success = vm6-native-stack-never-merge
merge_protections:
  - name: VM6 Native Stack Discriminator Always Green
    if: []
    success_conditions:
      - base = main
merge_protections_settings:
  reporting_method: check-runs
  post_comment: true
  auto_merge_conditions: true
