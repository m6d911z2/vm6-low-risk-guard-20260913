name: VM6 Playwright Project Prefix R5 0916
on:
  push:
    branches:
      - vm6-playwright-prefix-r4-20260916

jobs:
  vm6-playwright-project-prefix-r5-job:
    name: vm6-playwright-project-prefix-r5-job
    runs-on: ubuntu-latest
    env:
      MERGIFY_TOKEN: ${{ secrets.VM6_MERGIFY_TOKEN_PROJECT_PREFIX_R5 }}
      PLAYWRIGHT_MERGIFY_INCLUDE_PROJECT_IN_TEST_NAME: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create isolated published-package fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vm6-playwright-prefix-r5/tests
          cd vm6-playwright-prefix-r5
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-dev @playwright/test@1.62.1 @mergifyio/playwright@0.3.7
          cat > playwright.config.mjs <<'JS'
          import { defineConfig } from '@playwright/test';
          import { withMergify } from '@mergifyio/playwright';

          export default withMergify(defineConfig({
            testDir: './tests',
            workers: 1,
            projects: [
              { name: 'chromium' },
              { name: 'firefox' },
            ],
          }));
          JS
          cat > tests/prefix.spec.mjs <<'JS'
          import { test, expect } from '@mergifyio/playwright';

          test('VM6_PREFIX_SENTINEL_R5_0916', async () => {
            expect(6 * 7).toBe(42);
          });
          JS
      - name: Run two project-prefixed tests through published Mergify reporter
        working-directory: vm6-playwright-prefix-r5
        run: npx playwright test --config playwright.config.mjs --repeat-each=5
