name: VM6 Review Vitest Required 20260917
on:
  pull_request_review:
    types: [submitted]
permissions:
  contents: read
jobs:
  review-required:
    if: github.event.pull_request.title == 'VM6 external issue_comment Vitest false-green E2E 20260917'
    name: vm6-review-required
    runs-on: ubuntu-latest
    steps:
      - name: Install exact released consumer
        shell: bash
        run: |
          npm install -g pnpm@10.15.1 >/dev/null
          cat > package.json <<'JSON'
          {"private":true,"type":"module","devDependencies":{"vitest":"4.1.11","@mergifyio/vitest":"0.3.7"}}
          JSON
          pnpm install --ignore-scripts --silent
      - name: Create deterministic failing Vitest and config
        shell: bash
        run: |
          cat > consumer.test.js <<'JS'
          import { test, expect } from 'vitest';
          test('tests/test_vm6_issuecomment_vitest_e2e.py::test_vm6_issuecomment_vitest_e2e_20260917_s4k2', () => {
            expect('trusted').toBe('failed');
          });
          JS
          cat > vitest.config.mjs <<'JS'
          import { defineConfig } from 'vitest/config';
          import MergifyReporter from '@mergifyio/vitest';
          export default defineConfig({
            test: {
              include: ['consumer.test.js'],
              reporters: ['default', new MergifyReporter()],
              runner: '@mergifyio/vitest/runner',
            },
          });
          JS
      - name: Run deterministic failure through released Mergify Vitest consumer
        env:
          MERGIFY_TOKEN: ${{ secrets.VM6_ISSUECOMMENT_VITEST_TOKEN }}
          VITEST_MERGIFY_ENABLE: 'true'
        run: pnpm exec vitest run --config vitest.config.mjs
