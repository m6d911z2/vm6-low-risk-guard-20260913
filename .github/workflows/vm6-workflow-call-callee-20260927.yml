name: VM6 Workflow Call Callee 20260927
on:
  workflow_call:

jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - name: Record workflow_call provenance
        shell: bash
        run: |
          set -euo pipefail
          echo "EVENT=$GITHUB_EVENT_NAME"
          echo "SHA=$GITHUB_SHA"
          echo "REF=$GITHUB_REF"
          echo "REF_NAME=$GITHUB_REF_NAME"
          echo "BASE_REF=${GITHUB_BASE_REF:-<unset>}"
          echo "HEAD_REF=${GITHUB_HEAD_REF:-<unset>}"
          echo "WORKFLOW_SHA=${{ github.workflow_sha }}"
          python - <<'PY'
          import json, os
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              event = json.load(f)
          pr = event.get("pull_request") or {}
          print("PAYLOAD_ACTION=" + str(event.get("action")))
          print("PAYLOAD_PR_NUMBER=" + str(pr.get("number")))
          print("PAYLOAD_PR_HEAD=" + str((pr.get("head") or {}).get("sha")))
          print("PAYLOAD_PR_HEAD_REF=" + str((pr.get("head") or {}).get("ref")))
          print("PAYLOAD_PR_BASE=" + str((pr.get("base") or {}).get("ref")))
          PY
