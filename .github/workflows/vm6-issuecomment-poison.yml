name: VM6 Issue Comment Poison 20260917
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: read
jobs:
  poison:
    if: >-
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, 'VM6_ISSUECOMMENT_VITEST_POISON_S4K2')
    runs-on: ubuntu-latest
    steps:
      - name: Install published pytest client
        run: python -m pip install --disable-pip-version-check -q 'pytest==9.1.1' 'pytest-mergify==2026.9.11.2'
      - name: Create trusted poison test from comment-controlled boolean
        shell: python
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          import os
          from pathlib import Path
          should_pass = ' PASS' in os.environ['BODY']
          Path('tests').mkdir(exist_ok=True)
          Path('tests/test_vm6_issuecomment_vitest_e2e.py').write_text(
              'def test_vm6_issuecomment_vitest_e2e_20260917_s4k2():\n'
              f'    assert {should_pass!r}\n'
          )
      - name: Report poison sample to Test Insights
        env:
          MERGIFY_TOKEN: ${{ secrets.VM6_ISSUECOMMENT_VITEST_TOKEN }}
        run: pytest -q -s tests/test_vm6_issuecomment_vitest_e2e.py
