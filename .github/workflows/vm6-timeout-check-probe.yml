name: VM6 explicit check conclusion semantics probe
on:
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  publish-check-conclusions:
    name: vm6-custom-conclusion-publisher
    runs-on: ubuntu-latest
    steps:
      - name: Publish controlled check conclusions on PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          post_check() {
            name="$1"
            conclusion="$2"
            curl -fsS \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/check-runs" \
              -d "$(jq -nc --arg name "$name" --arg sha "$HEAD_SHA" --arg conclusion "$conclusion" '{name:$name,head_sha:$sha,status:"completed",conclusion:$conclusion,output:{title:$name,summary:("Controlled VM6 conclusion: "+$conclusion)}}')" \
              | jq '{id,name,status,conclusion,head_sha,app:{id:.app.id,slug:.app.slug}}'
          }
          post_check vm6-custom-timed-out timed_out
          post_check vm6-custom-action-required action_required
          post_check vm6-custom-stale stale
